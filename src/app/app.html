<!-- Cornice mobile centrata (ui-drafts/b-blade.html) -->
<div #frame class="frame mx-auto max-w-[430px] min-h-screen bg-surf">
  <main class="px-4 pt-5 pb-36 space-y-6">

    <!-- ══ 1 · HEADER — sticky, si condensa allo scroll (design D8) ══ -->
    <header class="sticky top-0 z-30 -mx-4 px-4 pb-3">
      <div class="cond-bar absolute inset-0 bg-surf/80 backdrop-blur-xl" aria-hidden="true"></div>
      <div class="relative flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="cond-avatar w-11 h-11 rounded-full bg-primC flex items-center justify-center shrink-0">
            <span class="t-body font-black tracking-tight text-onPrimC">DS</span>
          </div>
          <div>
            <h1 class="cond-title t-title font-extrabold tracking-tight leading-tight text-onSurf">Dolphin Surf</h1>
            <span class="cond-chip inline-block mt-1 px-2.5 py-0.5 rounded-full border border-outline t-caption font-semibold text-onSurfV">2025 EU · 43,2 kWh</span>
          </div>
        </div>
        <button type="button" aria-label="Impostazioni" (click)="settings.open()" class="btn btn-icon bg-surfC">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Pagina corrente — slide +12px → 0 al cambio rotta (design D11) -->
    <div #routePane class="route-pane route-in">
      <router-outlet />
    </div>
  </main>
</div>

<app-fab />
<app-settings-sheet #settings />
<app-navbar />
