<section class="space-y-4">
  <p class="t-body font-medium text-mut">Storico</p>

  <!-- Rhythm: blocchi pagina 24px (space-y-6) — caption→contenuto resta 16px (space-y-4) -->
  <div class="space-y-6">
  <!-- Righe lista M3E a pillola (leading circle + testi + meta trailing). Non
       interattive (specs/history): niente press/morph — solo l'entrance `.enter`
       all'attivazione della rotta (design D11). -->
  <div class="space-y-2">
    @for (entry of entries(); track entry.id) {
      <div #rowBlock class="enter in flex items-center gap-3 rounded-pill bg-surfC pl-2 pr-4 py-1.5">
        <div class="w-11 h-11 rounded-pill bg-surfHi flex items-center justify-center shrink-0 text-onSurfV">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/></svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="t-body font-semibold text-onSurf leading-snug truncate">{{ entry.title }}</p>
          <p class="t-meta text-mut truncate">{{ meta(entry) }}</p>
        </div>
        <span class="shrink-0 px-2.5 py-1 rounded-pill bg-secC text-onSecC t-meta font-bold">{{ km(entry) }}</span>
      </div>
    } @empty {
      <!-- Empty state: mai un gap vuoto -->
      <div #rowBlock class="enter in py-6 text-center">
        <p class="t-body-sm text-mut">Nessuna registrazione nello storico</p>
      </div>
    }
  </div>
  </div>
</section>
